server:
  port: 5002
spring:
  application:
    name: job-portal-company-service

  devtools:
    restart:
      enabled: true
      poll-interval: 2000
      quiet-period: 1000

  datasource:
    url: jdbc:postgresql://localhost:5432/yt_job_portal_company
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
