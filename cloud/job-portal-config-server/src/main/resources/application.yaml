server:
  port: 8888
spring:
  application:
    name: job-portal-config-server

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/Devendra15197/job-portal-config.git"
          clone-on-start: true
          default-label: master
          timeout: 30000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true